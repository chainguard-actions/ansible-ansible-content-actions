---
name: run-ansible-lint
description: Run the latest version of ansible-lint available at PyPI.

inputs:
  args:
    description: Arguments to be passed to ansible-lint command.
    required: false
    default: ""
    type: string
  setup_python:
    description: If false, this action will not setup python and will instead rely on the already installed python.
    required: false
    default: true
    type: boolean
  working_directory:
    description: The directory where to run ansible-lint from. Default is `github.workspace`.
    required: false
    default: ""
    type: string

runs:
  using: composite
  steps:
    - name: Show inputs
      id: inputs
      shell: bash
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        GITHUB_WORKSPACE_VAL: ${{ github.workspace }}
      run: |
        if [[ -n "$INPUT_WORKING_DIRECTORY" ]]; then
          echo "working_directory=$INPUT_WORKING_DIRECTORY"
        else
          echo "working_directory=$GITHUB_WORKSPACE_VAL"
        fi

    - name: Set up Python
      if: inputs.setup_python == 'true'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        cache: pip
        cache-dependency-path: ${{ inputs.working_directory }}/.git/ansible-lint-requirements.txt
        python-version: "3.11"

    - name: Install ansible-lint from pip
      shell: bash
      run: |
        pip install ansible-lint
        ansible-lint --version

    - name: Run ansible-lint
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        ANSIBLE_LINT_ARGS: ${{ inputs.args }}
      run: |
        ansible-lint ${ANSIBLE_LINT_ARGS:+"$ANSIBLE_LINT_ARGS"}
