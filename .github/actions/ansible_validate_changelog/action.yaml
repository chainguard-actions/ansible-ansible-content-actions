---
name: ansible_validate_changelog
description: Ensure a valid changelog has been added to the pull request.
inputs:
  path:
    description: |
      Path to the collection to validate changelog from.
    required: false
    default: .
  base_ref:
    description: The pull request base ref.
    required: false
    default: "${{ github.event.pull_request.base.ref }}"
runs:
  using: composite
  steps:
    - name: Setup python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
      with:
        python-version: "3.11"
    - name: Install python dependencies
      run: |
        pip install -U pyyaml
      shell: bash
    - name: Validate changelog
      env:
        ACTION_PATH: ${{ github.action_path }}
        BASE_REF: ${{ inputs.base_ref }}
      run: python3 "$ACTION_PATH/validate_changelog.py" --ref "$BASE_REF"
      shell: bash
      working-directory: "${{ inputs.path }}"
