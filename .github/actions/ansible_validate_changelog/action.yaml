---
name: ansible_validate_changelog
description: Ensure a valid changelog has been added to the pull request.
inputs:
  path:
    description: |
      Path to the collection to validate changelog from.
    required: false
    default: .
  base_ref:
    description: The pull request base ref.
    required: false
    default: "${{ github.event.pull_request.base.ref }}"
runs:
  using: composite
  steps:
    - name: Setup python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.14"
    - name: Install python dependencies
      run: |
        pip install -U pyyaml
      shell: bash
    - name: Validate changelog
      env:
        ACTION_PATH: ${{ github.action_path }}
        BASE_REF: ${{ inputs.base_ref }}
      run: >-
        python3 "$ACTION_PATH/validate_changelog.py" --ref "$BASE_REF"
      shell: bash
      working-directory: "${{ inputs.path }}"
