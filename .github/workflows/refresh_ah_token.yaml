---
name: Refresh automation hub token
"on":
  workflow_call:
    inputs:
      environment:
        description: The deployment environment
        required: true
        type: string
    secrets:
      ah_token:
        required: true

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    name: Refresh AH token
    environment: "${{ inputs.environment }}"
    steps:
      - name: Refresh the automation hub token
        env:
          AH_TOKEN: ${{ secrets.ah_token }}
        run: >-
          curl
          https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
          -d grant_type=refresh_token -d client_id=cloud-services -d
          refresh_token="$AH_TOKEN" --fail --silent --show-error
          --output /dev/null
