---
name: Ansible Unit
"on":
  workflow_call:
    inputs:
      collection_pre_install:
        required: false
        type: string
        default: ""
      extra_matrix_entries:
        required: false
        type: string

permissions:
  contents: read

jobs:
  tox-matrix:
    name: Matrix Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: "${{github.event.pull_request.head.ref}}"
          repository: "${{ github.event.pull_request.head.repo.full_name }}"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: "Check for tox-ansible.ini file, else add default"
        uses: ansible/ansible-content-actions/.github/actions/add_tox_ansible@11fc6c1c1a2421cac44cc5c40b6f72656745f1f9 # main
      - name: "Install tox-ansible, includes tox"
        run: "python -m pip install tox-ansible"
      - name: Generate matrix
        id: generate-matrix
        run: >
          python -m tox --ansible --gh-matrix --matrix-scope unit --conf
          tox-ansible.ini
      - name: Merge matrix with extra entries
        id: merge-matrix
        env:
          GENERATED_MATRIX: ${{ steps.generate-matrix.outputs.envlist }}
          EXTRA_MATRIX: ${{ inputs.extra_matrix_entries }}
        run: |
          echo "Generated matrix: $GENERATED_MATRIX"
          echo "Extra matrix: $EXTRA_MATRIX"

          merged=$(
            jq -c -n \
              --argjson a "$GENERATED_MATRIX" \
              --argjson b "${EXTRA_MATRIX:-[]}" \
              '$a + $b'
          )
          echo "Merged matrix: $merged"
          safe_merged=$(printf '%s' "$merged" | tr -d '\n\r')
          echo "envlist=$safe_merged" >> "$GITHUB_OUTPUT"
    outputs:
      envlist: "${{ steps.merge-matrix.outputs.envlist }}"
  test:
    needs: tox-matrix
    strategy:
      fail-fast: false
      matrix:
        entry: "${{ fromJson(needs.tox-matrix.outputs.envlist) }}"
    name: "${{ matrix.entry.name }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "${{ matrix.entry.python }}"
      - name: "Install tox-ansible, includes tox"
        run: python -m pip install tox-ansible
      - name: "Check for tox-ansible.ini file, else add default"
        uses: ansible/ansible-content-actions/.github/actions/add_tox_ansible@11fc6c1c1a2421cac44cc5c40b6f72656745f1f9 # main
      - name: Install build toolchain and openssl headers on Linux
        shell: bash
        run: sudo apt update && sudo apt install build-essential libssl-dev
        if: ${{ matrix.entry.python >= 3.12 }}
      - name: Install catchsegv and libssh headers on Linux for cythonize+coverage
        shell: bash
        run: sudo apt update && sudo apt install libssh-dev
        if: ${{ matrix.entry.python >= 3.12 }}
      - name: Run tox unit tests
        env:
          TOX_ENV: ${{ matrix.entry.name }}
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: >-
          python -m tox --ansible -e "$TOX_ENV" --conf
          tox-ansible.ini
