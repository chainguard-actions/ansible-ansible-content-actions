---
name: Ansible sanity
"on":
  workflow_call: null

permissions: {}

jobs:
  tox-matrix:
    name: Matrix Sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: "${{github.event.pull_request.head.ref}}"
          repository: "${{ github.event.pull_request.head.repo.full_name }}"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: "Install tox-ansible, includes tox"
        run: "python -m pip install tox-ansible"
      - name: "Check for tox-ansible.ini file, else add default"
        uses: ansible/ansible-content-actions/.github/actions/add_tox_ansible@41201c8e472d212b283090605b5120d2374261b4 # main
      - name: Generate matrix
        id: generate-matrix
        run: >
          python -m tox --ansible --gh-matrix --matrix-scope sanity --conf
          tox-ansible.ini
    outputs:
      envlist: "${{ steps.generate-matrix.outputs.envlist }}"
  test:
    needs: tox-matrix
    strategy:
      fail-fast: false
      matrix:
        entry: "${{ fromJson(needs.tox-matrix.outputs.envlist) }}"
    name: "${{ matrix.entry.name }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "${{ matrix.entry.python }}"
      - name: "Install tox-ansible, includes tox"
        run: python -m pip install tox-ansible
      - name: "Check for tox-ansible.ini file, else add default"
        uses: ansible/ansible-content-actions/.github/actions/add_tox_ansible@41201c8e472d212b283090605b5120d2374261b4 # main
      - name: Run tox sanity tests
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TOX_ENTRY: ${{ matrix.entry.name }}
        run: >-
          python -m tox --ansible -e "$TOX_ENTRY" --conf
          tox-ansible.ini
