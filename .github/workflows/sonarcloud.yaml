---
name: SonarCloud Scan
on:
  workflow_call:
    inputs:
      python_version:
        description: "Python version to use for testing"
        default: "3.12"
        required: false
        type: string
      galaxy_dependencies:
        description: "Multiline list of Ansible Galaxy dependencies to install (git URLs or names)"
        required: false
        type: string
        default: ""
      test_command:
        description: "Command to run unit tests and generate coverage"
        default: "pytest tests/unit -v --cov-report xml --cov=./"
        required: false
        type: string
      sonar_args:
        description: "Additional arguments to pass to the SonarScanner"
        default: ""
        required: false
        type: string
      sonar_scanner_java_opts:
        description: "Java Sonar Stack size"
        default: ""
        required: false
        type: string
    secrets:
      SONAR_TOKEN:
        description: "SonarCloud API Token"
        required: true

permissions:
  contents: read
  actions: read
  pull-requests: write
  security-events: write

jobs:
  sonar:
    name: SonarCloud Coverage
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request || contains(github.event.pull_request.labels.*.name, 'safe to test') }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          show-progress: false

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Python + Testing Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core pytest pytest-cov pytest-ansible-units pytest-forked pytest-xdist lxml
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Install Ansible Collection Dependencies
        if: ${{ inputs.galaxy_dependencies != '' }}
        env:
          GALAXY_DEPENDENCIES: ${{ inputs.galaxy_dependencies }}
        run: |
          # Read the multiline input and install each dependency
          while IFS= read -r line; do
            if [[ -n "$line" ]]; then
              echo "Installing: $line"
              ansible-galaxy collection install "$line"
            fi
          done <<< "$GALAXY_DEPENDENCIES"

      - name: Print Environment Info
        run: |
          ansible --version
          python3 -m pip list

      - name: Prepare Sonar Args
        id: sonar-args
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT_NAME" == "pull_request_target" ]; then
            # Build string for PRs to ensure we analyze the HEAD of the PR
            safe_sha=$(printf '%s' "$PR_HEAD_SHA" | tr -d '\n\r')
            safe_num=$(printf '%s' "$PR_NUMBER" | tr -d '\n\r')
            safe_head=$(printf '%s' "$PR_HEAD_REF" | tr -d '\n\r')
            safe_base=$(printf '%s' "$PR_BASE_REF" | tr -d '\n\r')
            ARGS="-Dsonar.scm.revision=$safe_sha"
            ARGS="$ARGS -Dsonar.pullrequest.key=$safe_num"
            ARGS="$ARGS -Dsonar.pullrequest.branch=$safe_head"
            ARGS="$ARGS -Dsonar.pullrequest.base=$safe_base"
            echo "ARGS=$ARGS" >> $GITHUB_OUTPUT
          else
            echo "ARGS=" >> $GITHUB_OUTPUT
          fi

      - name: Checkout PR Branch Code
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin pull/"$PR_NUMBER"/head:pr
          git checkout pr

      - name: Run Unit Tests with Coverage
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
        run: |
          # Split the command on whitespace into an array and execute it directly,
          # avoiding writing untrusted content to a shell script file.
          read -ra cmd_args <<< "$TEST_COMMAND"
          "${cmd_args[@]}"

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@ad8210318ac8bb816e41990d5af2b304f7a6c213 # master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_JAVA_OPTS: ${{ inputs.sonar_scanner_java_opts }}
        with:
          args: >
            ${{ steps.sonar-args.outputs.ARGS }}
            -Dsonar.python.coverage.reportPaths=coverage.xml
            ${{ inputs.sonar_args }}
