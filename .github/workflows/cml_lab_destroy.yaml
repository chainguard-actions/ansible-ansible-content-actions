name: CML Lab Destroy

on:
  workflow_call:
    inputs:
      lab_title_override:
        description: Optional lab title override; if empty uses PR title
        required: false
        type: string
        default: ""
    secrets:
      virl_host:
        required: true
      virl_username:
        required: false
      virl_password:
        required: true

permissions:
  contents: read

jobs:
  destroy_lab:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request || contains(github.event.pull_request.labels.*.name, 'safe to test') }}
    env:
      PY_COLORS: "1"
    environment: integration_destroy
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Determine lab title
        id: lab
        shell: bash
        env:
          LAB_TITLE_OVERRIDE: ${{ inputs.lab_title_override }}
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          title="$LAB_TITLE_OVERRIDE"
          if [[ -z "$title" && "$EVENT_NAME" == "pull_request" ]]; then
            title="$PR_TITLE"
          fi
          if [[ -z "$title" ]]; then
            title="$REPOSITORY-$RUN_ID"
          fi
          clean_title=$(sed -E 's/[^A-Za-z0-9 _-]+//g; s/[[:space:]]+/ /g; s/^ +| +$//g' <<< "$title")
          safe_title=$(printf '%s' "$clean_title" | tr -d '\n\r')
          echo "title=$safe_title" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Install ansible and CML collection
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.18
          python -m pip install virl2_client==2.7.1
          ansible-galaxy collection install git+https://github.com/KB-perByte/cml.git

      - name: Create destroy playbook
        shell: bash
        run: |
          cat > cml_destroy.yml <<'YAML'
          ---
          - hosts: localhost
            gather_facts: no
            connection: local
            tasks:
              - name: Stop the lab
                cisco.cml.cml_lab:
                  host: "{{ cml_host }}"
                  user: "{{ cml_username }}"
                  password: "{{ cml_password }}"
                  lab: "{{ cml_lab }}"
                  state: stopped
                tags:
                  - stop
                  - wipe
                  - erase
              - name: Wipe the lab
                cisco.cml.cml_lab:
                  host: "{{ cml_host }}"
                  user: "{{ cml_username }}"
                  password: "{{ cml_password }}"
                  lab: "{{ cml_lab }}"
                  state: wiped
                tags:
                  - wipe
                  - erase
              - name: Erase the lab
                cisco.cml.cml_lab:
                  host: "{{ cml_host }}"
                  user: "{{ cml_username }}"
                  password: "{{ cml_password }}"
                  lab: "{{ cml_lab }}"
                  state: absent
                tags:
                  - erase
          YAML

      - name: Run destroy playbook
        shell: bash
        env:
          CML_HOST: ${{ secrets.VIRL_HOST }}
          CML_USERNAME: ${{ secrets.VIRL_USERNAME }}
          CML_PASSWORD: ${{ secrets.VIRL_PASSWORD }}
          CML_LAB: ${{ steps.lab.outputs.title }}
          CML_VERIFY_CERT: "false"
        run: |
          set -euo pipefail
          echo "Destroying lab: $CML_LAB"
          ansible-playbook cml_destroy.yml \
            -e cml_host="$CML_HOST" \
            -e cml_username="$CML_USERNAME" \
            -e cml_password="$CML_PASSWORD" \
            -e cml_lab="$CML_LAB"
