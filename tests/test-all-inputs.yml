name: Test all inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: "."
          base_ref: main
          repo: https://github.com/ansible/ansible-content-actions
          environment: staging
          ah_publish: "false"
          galaxy_publish: "false"
          collection_pre_install: "ansible.utils"
      - name: Assert action completed successfully
        run: |
          echo "Action completed without error"
          echo "PASS"
