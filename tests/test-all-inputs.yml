---
name: Test with all optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Invoke action with all optional inputs
        id: action
        uses: .
        with:
          path: ${{ github.workspace }}
          base_ref: main
          repo: https://github.com/ansible/ansible-content-actions
          environment: release
          ah_publish: "false"
          galaxy_publish: "false"
          collection_pre_install: ""
        continue-on-error: true
      - name: Assert action was invoked with all inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action was invoked with all inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
