---
name: Test basic usage - no inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
      - name: Assert action was invoked
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          echo "Action completed (outcome: ${{ steps.action.outcome }})"
          echo "PASS"
