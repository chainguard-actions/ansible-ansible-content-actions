name: Test basic usage with path, repo, and environment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: "."
          repo: "https://github.com/ansible/ansible-content-actions"
          environment: "staging"
      - name: Assert action completed
        run: |
          echo "Action completed successfully with path, repo, and environment inputs"
          echo "PASS"
