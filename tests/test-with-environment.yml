name: Test usage with environment and collection_pre_install inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          environment: staging
          collection_pre_install: "ansible.utils"
      - name: Assert action was invoked with environment inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: action was invoked with environment and collection_pre_install inputs (outcome=$OUTCOME)"
