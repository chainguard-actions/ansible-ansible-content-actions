---
name: Test with optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo: https://github.com/ansible/ansible-content-actions
          environment: test
          ah_publish: "false"
          galaxy_publish: "false"
          collection_pre_install: ""
      - name: Assert action was invoked with optional inputs
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          echo "Action completed with optional inputs (outcome: ${{ steps.action.outcome }})"
          echo "PASS"
