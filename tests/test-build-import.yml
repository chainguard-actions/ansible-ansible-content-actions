---
name: Test build-import sub-action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.5.0
        with:
          python-version: "3.11"
      - name: Verify galaxy.yml exists in workspace
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/galaxy.yml" ]; then
            echo "FAIL: galaxy.yml not found in workspace"
            ls -la "$GITHUB_WORKSPACE/"
            exit 1
          fi
          echo "galaxy.yml contents:"
          cat "$GITHUB_WORKSPACE/galaxy.yml"
          echo "PASS: galaxy.yml found"
      - id: build-import
        uses: ./.github/actions/build-import
        continue-on-error: true
      - name: Assert build-import ran (may fail without a complete collection structure)
        env:
          OUTCOME: ${{ steps.build-import.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: build-import succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: build-import failed gracefully (expected - workspace may not be a complete collection)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
