name: Test publish inputs with base_ref, ah_publish, galaxy_publish, and collection_pre_install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          base_ref: "main"
          ah_publish: "false"
          galaxy_publish: "false"
          collection_pre_install: "community.general"
      - name: Assert action completed
        run: |
          echo "Action completed successfully with base_ref, ah_publish, galaxy_publish, and collection_pre_install inputs"
          echo "PASS"
