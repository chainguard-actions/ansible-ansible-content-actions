---
name: Test with base_ref input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          base_ref: main
      - name: Assert action was invoked with base_ref input
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          echo "Action completed with base_ref=main (outcome: ${{ steps.action.outcome }})"
          echo "PASS"
